# Configuracion del registro, versionada aqui —y no heredada de la imagen de
# terceros— para que cambiarla sea un commit y un despliegue, no una edicion a
# mano en un nodo.
version: 0.1
log:
  fields:
    service: registry
storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  # Sin esto, la API de borrado responde 405 y NO hay forma de recuperar espacio:
  # ni borrando etiquetas ni recolectando basura. Viene desactivado de fabrica.
  #
  # El motor sólo escucha en loopback. El acceso público pasa por la puerta
  # HTTPS del mismo contenedor, que exige credenciales y permisos por operación.
  delete:
    enabled: true
http:
  addr: 127.0.0.1:5050
  relativeurls: true
  headers:
    X-Content-Type-Options: [nosniff]
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
